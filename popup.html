<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunch Lotto</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
  <div id="popup-container">
    <!-- Main View -->
    <div id="main-view">
      <!-- Navigation Bar -->
      <div class="nav-buttons">
        <button id="open-settings">
          <img src="assets/filter.jpg" alt="Settings">
        </button>
        <button id="open-history">
          <i class="material-icons">history</i>
        </button>
      </div>

      <!-- Loading Container -->
      <div id="loading-container" style="display: none;">
        <img id="loading-gif" src="assets/loading.gif" alt="Loading...">
        <div id="progress-container">
          <div id="progress-bar"></div>
        </div>
        <div id="progress-text">Finding nearby restaurants...</div>
      </div>

      <div id="wheel-container">
        <canvas id="wheel" width="310" height="310"></canvas>
        <button id="spin">Spin</button>
      </div>
      <!-- 🏆 Selected Restaurant Result -->
      <div id="result-container" style="display: none;">
        <p id="selected-restaurant"></p>
        <a id="google-maps-link" href="#" target="_blank" style="display: none;">View on Google Maps</a>
      </div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="view">
      <div class="form-group">
        <label for="distance">Distance (miles) 🗺️</label>
        <input type="number" id="distance" min="0.1" max="10" step="0.1" placeholder="e.g., 0.5">
      </div>
      <div class="form-group">
        <label for="price">Price Level 💰</label>
        <select id="price">
          <option value="1,2">$ - $$</option>
          <option value="2,3" selected>$$ - $$$</option>
          <option value="3,4">$$$ - $$$$</option>
        </select>
      </div>
      <button id="save-settings">Save</button>
      <button id="close-settings">Back</button>
    </div>

    <!-- Update 4: Add History View -->
    <div id="history-view" class="view">
      <h3>Previous Selections</h3>
      <div id="history-list"></div>
      <button id="close-history">Back</button>
    </div>
  </div>

  <script src="libs/sweetalert.min.js"></script>
  <script src="wheel.js"></script>
  <script src="popup.js"></script>

</body>

</html>
